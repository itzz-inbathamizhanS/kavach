spring:
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/kavach}
      database: kavach
jwt:
  # 64-character hex secret for HS512
  secret: ${JWT_SECRET:defaultSecretKeyThatIsAtLeast64CharactersLongForLocalDevelopment}
  expiration-ms: 86400000 # 24 hours

server:
  port: 8080
